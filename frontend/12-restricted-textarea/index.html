<!DOCTYPE html>
<html>
    <head>
        <title>Restricted Textarea</title>
        <meta charset="UTF-8">
        <meta name="description" content="A textarea component with a live character counter and character input restriction.">
        <meta name="keywords" content="textarea, character count, input restriction, live counter, JavaScript, frontend component"> 
        <meta name="author" content="Thanarat Ruengkum">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script type="text/javascript" src="script.js" defer></script>
    </head>
    <body>
        <div class="textarea">
            <textarea placeholder="Start Typing..."></textarea>
            <span class="text-count">0/250</span>
        </div>
    </body>
</html>
