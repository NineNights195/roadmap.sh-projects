        <header>

            </section>
            <div class="flex-wrapper">

                    <form action="#" method="post">
                        <div>
                            <label for="fname">First Name</label>
                            <input type="text" id="fname" name="fname" placeholder="Thanarat">

                            <input type="text" id="lname" name="lname" placeholder="Ruengkum">
                        </div>

                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="thanarat.ruengkum@gmail.com">
                        </div>
                        <div>
                            <label for="message">Message</label>
                            <input type="text" id="message" name="message" placeholder="Hello, I'd like to mail you">
                        </div>
                        <div>
                            <input type="reset">
                            <input type="submit">
                        </div>
