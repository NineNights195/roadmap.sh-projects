[project]
name = "task-cli"
version = "0.1.0"
description = "Task tracker CLI app that track your tasks and manage to-do list"
authors = [
    {name = "Thanarat Ruengkum",email = "thanarat.ruengkum@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.26.7",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
task-cli = "app:cli"
